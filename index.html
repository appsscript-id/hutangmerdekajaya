<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hutang">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sistem Manajemen Hutang</title>
<script>window.__dip=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__dip=e;if(window.updateInstUI)updateInstUI()});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--brand:#4f46e5;--brand-d:#4338ca;--brand-l:#eef2ff;--acc:#4f46e5;--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e9f2;--ok:#059669;--warn:#d97706;--bad:#e11d48;--r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:14px}
.ic{width:18px;height:18px;flex:none;vertical-align:middle}
.hidden{display:none!important}

/* ===== LOGIN ===== */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-l{background:linear-gradient(145deg,#1e1b4b,#4338ca 55%,#6d28d9);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-l:before,.lg-l:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.lg-l:before{width:480px;height:480px;right:-160px;top:-120px}
.lg-l:after{width:320px;height:320px;left:-100px;bottom:-100px}
.lg-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;position:relative;z-index:1}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#a78bfa);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,70,229,.35)}
.logo .ic{width:22px;height:22px}
.lg-hero{position:relative;z-index:1}
.lg-hero h1{font-size:36px;line-height:1.15;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.lg-hero p{max-width:440px;opacity:.85;font-size:15px;margin:0}
.lg-foot{opacity:.7;font-size:12px;position:relative;z-index:1}
.lg-r{display:grid;place-items:center;padding:32px;background:#fff}
.lg-card{width:100%;max-width:380px}
.lg-card h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
.lg-card .sub{color:var(--mut);margin-bottom:26px}
.fg{margin-bottom:16px}
.fg label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:#334155}
.inp{width:100%;padding:10px 12px;border:1px solid #d5dbe8;border-radius:10px;background:#fff;color:var(--tx);outline:none;transition:.15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.inp[readonly]{background:#f1f5f9}
.err{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:13px}

/* ===== BUTTON ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.15s;background:var(--brand);color:#fff;white-space:nowrap}
.btn:hover{background:var(--brand-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--tx);border-color:#d5dbe8}
.btn.sec:hover{background:#f8fafc}
.btn.acc{background:linear-gradient(135deg,#6366f1,#4f46e5);box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn.acc:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#047857}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.block{width:100%;justify-content:center;padding:11px}
.btn.ghost{background:transparent;color:var(--brand);padding:6px 8px}
.btn.ghost:hover{background:var(--brand-l)}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecdd3}
.btn.danger:hover{background:#fff1f2}

/* ===== SHELL ===== */
.top{position:fixed;top:0;left:0;right:0;height:calc(60px + var(--sat));background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(10px);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--bd);color:var(--tx);display:flex;align-items:center;gap:12px;padding:var(--sat) 18px 0;z-index:40}
.top .logo{width:34px;height:34px;border-radius:10px}
.top .ttl{font-weight:700;font-size:15.5px;line-height:1.1;letter-spacing:-.01em}
.top .ttl small{display:block;font-weight:500;color:var(--mut);font-size:11.5px;margin-top:3px}
.top .sp{flex:1}
.top .icbtn{background:#f1f5f9;border:0;color:#475569;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.top .icbtn:hover{background:#e2e8f0}
.top .burger{display:none}
.usr{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--bd)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:700}
.usr .nm{font-weight:600;font-size:13px;line-height:1.1}
.usr .rl{font-size:11px;color:var(--mut);text-transform:capitalize}
.side{position:fixed;top:calc(60px + var(--sat));bottom:0;left:0;width:248px;background:#fff;border-right:1px solid var(--bd);padding:14px 12px;overflow:auto;z-index:55;transition:.25s}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:10px 10px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#475569;text-decoration:none;font-weight:500;margin-bottom:2px;cursor:pointer;position:relative}
.nav a:hover{background:#f5f7ff}
.nav a.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.nav a.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.main{margin-left:248px;padding:calc(82px + var(--sat)) 26px 40px;min-height:100vh;min-width:0}
#view,#pg{min-width:0;max-width:100%}
.crumb{color:var(--mut);font-size:12.5px;margin-bottom:6px}
.crumb b{color:var(--brand)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ===== CARDS ===== */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.panel>.hd{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel>.hd h3{margin:0;font-size:15px;font-weight:700}
.panel>.bd{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;min-width:0}
.kpi .ki{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.kpi .ki .ic{width:22px;height:22px}
.kpi .kl{color:var(--mut);font-size:12px;font-weight:600}
.kpi .kv{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .ks{font-size:11.5px;color:var(--mut);margin-top:1px}
.c-blue{background:#eef2ff;color:#4f46e5}.c-green{background:#d1fae5;color:#059669}.c-amber{background:#fef3c7;color:#d97706}.c-red{background:#ffe4e6;color:#e11d48}.c-gray{background:#f1f5f9;color:#475569}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>*,.grid2b>*{min-width:0}
.mseg{display:none}

/* ===== TABLE ===== */
.tools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--bd);align-items:center}
.sbox{position:relative;flex:1;min-width:220px}
.sbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:16px;height:16px}
.sbox .inp{padding-left:34px}
.tools select.inp{width:auto;min-width:150px}
.tw{overflow:auto;max-height:640px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #eef1f7;white-space:nowrap}
th{position:sticky;top:0;background:#f8fafc;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#475569;font-weight:700;z-index:2;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:var(--brand)}
th .ar{opacity:.4;margin-left:4px;font-size:10px}
th.on .ar{opacity:1;color:var(--brand)}
tbody tr:hover{background:#f7f8ff}
tbody tr.clk{cursor:pointer}
td.r,th.r{text-align:right}
td.mono{font-variant-numeric:tabular-nums}
tfoot td{background:#f8fafc;font-weight:700;position:sticky;bottom:0;border-top:2px solid var(--bd)}
.empty{text-align:center;color:var(--mut);padding:42px 10px}
.pg{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.pg .pb{display:flex;gap:6px;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.b-ok{background:#d1fae5;color:#047857}.b-warn{background:#fef3c7;color:#b45309}.b-red{background:#ffe4e6;color:#be123c}.b-blue{background:#e0e7ff;color:#4338ca}.b-gray{background:#e2e8f0;color:#475569}
.sub{color:var(--mut);font-size:12px}
.prog{height:8px;background:#e8ebf4;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.rank{display:flex;flex-direction:column;gap:14px}
.rank .it .t{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-weight:600;font-size:13px}
.rank .it .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .prog i{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:center}

/* ===== DRAWER / MODAL ===== */
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:#fff;z-index:60;transform:translateX(100%);transition:.28s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dr-h{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#4338ca,#6366f1);color:#fff}
.dr-h h3{margin:0;font-size:16px}
.dr-h button{background:rgba(255,255,255,.18);border:0;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer}
.dr-b{padding:20px;overflow:auto;flex:1}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px}
.kv2 .k{font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kv2 .v{font-weight:600;word-break:break-word}
.kv2 .full{grid-column:1/-1}
.sumbox{background:var(--brand-l);border-radius:14px;padding:16px;margin-bottom:18px}
.sumbox .row{display:flex;justify-content:space-between;padding:4px 0}
.sumbox .row.big{font-size:17px;font-weight:800;color:var(--brand);border-top:1px dashed #c7d2fe;margin-top:6px;padding-top:10px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:520px;max-width:calc(100% - 28px);max-height:calc(100% - 40px);background:#fff;border-radius:16px;z-index:70;opacity:0;pointer-events:none;transition:.2s;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{padding:20px;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.x{background:none;border:0;cursor:pointer;color:var(--mut);width:30px;height:30px;border-radius:8px}
.x:hover{background:#f1f5f9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.cbx{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #d5dbe8;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.18);max-height:230px;overflow:auto;z-index:5}
.cbx .opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.cbx .opt:last-child{border:0}
.cbx .opt:hover{background:var(--brand-l)}
.cbx .o1{display:flex;justify-content:space-between;gap:10px}
.cbx .o1 span{color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}
.cbx .o2{font-size:13px}
.cbx .o3{font-size:11.5px;color:var(--mut)}
.panel>.bd{position:relative}
.cw{position:absolute;inset:10px 14px}
#pg.dash{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 128px)}
#pg.dash .ph{margin-bottom:0}
#pg.dash .kpis{margin-bottom:0;gap:12px}
#pg.dash .kpi{padding:10px 14px}
#pg.dash .kpi .ki{width:38px;height:38px}
#pg.dash .kpi .kv{font-size:17px}
#pg.dash .blk{flex:1 1 0;min-height:230px;display:flex;flex-direction:column}
#pg.dash .panel{margin-bottom:0;display:flex;flex-direction:column;min-height:0}
#pg.dash .panel>.hd{padding:10px 16px}
#pg.dash .panel>.bd{flex:1;min-height:0;padding:12px 16px}
#pg.dash .blk>.grid2,#pg.dash .blk>.grid2b{gap:14px;flex:1 1 0;min-height:0;grid-template-rows:minmax(0,1fr)}
#pg.dash .fill{overflow:auto;flex:1;min-height:0;max-height:none}
.infobox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:8px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0 14px;font-size:13px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--brand)}

/* ===== TOAST & LOADER ===== */
#toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:360px;font-size:13.5px;border-left:4px solid #10b981;animation:ti .25s}
.toast.err{border-color:#f43f5e}
@keyframes ti{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:90;display:grid;place-items:center}
.spin{width:44px;height:44px;border:4px solid #dbe0ee;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--brand-l);border-radius:12px;padding:14px 16px;font-size:13px;color:#312e81}
.note ol{margin:8px 0 0;padding-left:20px}

/* kartu daftar hutang (hanya tampil di HP) */
.mcards{display:none}

@media(max-width:1000px){
  .grid2,.grid2b{grid-template-columns:minmax(0,1fr)}
  #login{grid-template-columns:1fr}.lg-l{display:none}
  .side{transform:translateX(-100%)}
  .side.on{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .main{margin-left:0;padding:calc(76px + var(--sat)) 14px 30px}
  .top .burger{display:grid}
  .usr .tx{display:none}
  #pg.dash{min-height:0}
  #pg.dash .blk{flex:none;min-height:0}
  #pg.dash .blk>.grid2,#pg.dash .blk>.grid2b{flex:none;grid-template-rows:none}
  #pg.dash .panel>.bd.cb{min-height:260px}
  #pg.dash .fill{max-height:320px}
}
@media(max-width:560px){.row2,.kv2{grid-template-columns:1fr}.ph h1{font-size:20px}}

/* ===== TAMPILAN HP ===== */
@media(max-width:700px){
  body{font-size:13.5px}
  .inp,select.inp{font-size:16px} /* cegah auto-zoom di iOS */
  .crumb{display:none}
  .top{height:calc(54px + var(--sat));padding:var(--sat) 10px 0;gap:8px}
  .top .ttl{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .ttl small{display:none}
  .usr{padding-left:8px;gap:6px}
  .avatar{display:none}
  .side{top:calc(54px + var(--sat));width:82%;max-width:290px}
  .main{padding:calc(64px + var(--sat)) 10px calc(24px + var(--sab))}
  .lg-r{padding:20px}
  .ph .acts{width:100%}
  .ph .acts .btn{flex:1;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:10px 12px;gap:8px}
  .kpi .ki{display:none}
  .kpi .kv{font-size:15px}
  .tools{padding:10px}
  .sbox{min-width:100%}
  .tools select.inp{flex:1 1 45%;max-width:none!important;width:auto;min-width:0}
  .panel>.hd{padding:12px}
  .panel>.bd{padding:12px}
  th,td{padding:9px 10px}
  .tw{max-height:70vh}
  #fk .tw{display:none}
  .mcards{display:block}
  .mc{padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}
  .mc:active{background:#f1f5f9}
  .mc1{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .mc1 b{min-width:0}
  .mc1 span{font-weight:800;color:var(--brand);white-space:nowrap}
  .mc2{color:var(--mut);font-size:12px;margin:3px 0 6px}
  .mc3{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
  .mtot{padding:12px;font-weight:600;background:#f8fafc;text-align:right}
  .pg{justify-content:center;padding:10px}
  .drawer{width:100%}
  .modal{max-height:calc(100% - 16px)}
  .modal .mb{padding:14px}
  .modal .mh,.modal .mf{padding:12px 14px}
  .dr-b{padding:14px}
  #toasts{left:10px;right:10px;bottom:10px}
  .toast{max-width:none}

  /* --- Dashboard: muat 1 layar, tanpa scroll --- */
  .main:has(#pg.dash){padding-bottom:calc(10px + var(--sab))}
  #pg.dash{height:auto;min-height:0;gap:10px;overflow:visible}
  #pg.dash .banner{display:none}
  #pg.dash .ph{align-items:center;flex-wrap:nowrap;gap:8px;flex:none}
  #pg.dash .ph>div:first-child{min-width:0}
  #pg.dash .ph h1{font-size:16px}
  #pg.dash .ph .sub{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pg.dash .ph .acts{width:auto;flex:none}
  #pg.dash .ph .acts .btn{padding:7px 11px;font-size:12px;flex:none}
  #pg.dash .kpis{grid-template-columns:1fr 1fr;gap:6px;flex:none}
  #pg.dash .kpi{padding:7px 10px;border-radius:12px}
  #pg.dash .kpi:last-child{grid-column:1/-1}
  #pg.dash .kpi .kl{font-size:10.5px}
  #pg.dash .kpi .kv{font-size:13.5px;margin-top:1px}
  #pg.dash .kpi .ks{font-size:10px;margin-top:0}

<script>
/* ======================================================
   KONFIGURASI  —  tempel URL Web App Apps Script di sini
   ====================================================== */
const APP_VERSION = '1.0.4';
const API_URL = 'https://script.google.com/macros/s/AKfycbxwwgDx2Db0HuiLshTrpt2sUOnnJ4pD5Ik3hcKvP3SO5YbCouqyQAh52TzmbaeW6zTo/exec';


/* ====================== PDF DOWNLOAD ====================== */
function downloadPDF(){
  const pg = $('pg');
  if(!pg) return toast('Area laporan tidak ditemukan','err');
  
  // Clone element to sanitize for PDF
  const clone = pg.cloneNode(true);
  
  // Remove non-data items like tools, buttons, pagination controls, search inputs
  const toRemove = clone.querySelectorAll('.tools, .acts, .noprint, .pg, button, select');
  toRemove.forEach(el => el.remove());
  
  // Fix for 100 rows cutting off: remove max-height and overflow restrictions on tables/wrappers in the clone
  clone.querySelectorAll('.tw').forEach(el => {
    el.style.maxHeight = 'none';
    el.style.overflow = 'visible';
    el.style.height = 'auto';
  });
  
  // Ensure rows never break inside pages
  clone.querySelectorAll('tr').forEach(tr => {
    tr.style.pageBreakInside = 'avoid';
    tr.style.breakInside = 'avoid';
  });

  const opt = {
    margin:      [10, 10, 10, 10],
    filename:    'laporan-hutang.pdf',
    image:       { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, logging: false, windowWidth: 1200 },
    jsPDF:       { unit: 'mm', format: 'a4', orientation: 'landscape' },
    pagebreak:   { mode: ['avoid-all', 'css', 'legacy'], avoid: ['tr', '.panel'] }
  };
  
  busy(true);
  html2pdf().from(clone).set(opt).save().then(()=>{
    busy(false);
    toast('PDF data berhasil diunduh');
  }).catch(e=>{
    busy(false);
    toast('Gagal mengunduh PDF: ' + (e.message || e), 'err');
  });
}

/* ====================== UTIL ====================== */
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const rp=n=>'Rp '+nf.format(n||0);
const rp0=n=>'Rp '+nf0.format(Math.round(n||0));
const num=n=>nf.format(n||0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=iso=>{if(!iso)return '-';const p=iso.split('-');return +p[2]+' '+MON[p[1]-1]+' '+p[0]};
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const $=id=>document.getElementById(id);
const BK=['Belum Jatuh Tempo','1–30 hari','31–60 hari','61–90 hari','> 90 hari'];
const BC=['#10b981','#fbbf24','#f97316','#ef4444','#9f1239'];

const P={
 home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
 calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
 clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
 sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
 refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
 search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
 plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
 x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
 menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
 logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
 alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
 check:'<polyline points="20 6 9 17 4 12"/>',
 printer:'<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
 money:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
 layers:'<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
function hydrateIcons(root){(root||document).querySelectorAll('[data-ic]').forEach(e=>{if(!e.firstChild)e.innerHTML=ic(e.dataset.ic)})}

function toast(m,t){const d=document.createElement('div');d.className='toast'+(t==='err'?' err':'');d.textContent=m;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4200)}
function busy(v){$('busy').classList.toggle('hidden',!v)}

/* ====================== STATE & API ====================== */
const S={token:null,user:null,data:null,map:{},charts:[],page:'dashboard',
  f:{q:'',status:'',periode:'',supplier:'',sort:'tgl',dir:'desc',page:1,size:25},
  sq:'',pq:''};
const can={pay:()=>S.user&&['admin','staf'].includes(S.user.role),admin:()=>S.user&&S.user.role==='admin'};

async function api(action,payload){
  if(API_URL.indexOf('GANTI_')===0) throw new Error('API_URL belum diisi di index.html');
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,token:S.token},payload||{}))});
  const j=await res.json();
  if(j.code==='AUTH'){clearSession();showLogin('Sesi berakhir, silakan login kembali.');throw new Error(j.error)}
  if(!j.ok) throw new Error(j.error||'Terjadi kesalahan');
  return j;
}
function saveSession(){try{localStorage.setItem('hp_sess',JSON.stringify({t:S.token,u:S.user}))}catch(e){}}
function clearSession(){S.token=null;S.user=null;try{localStorage.removeItem('hp_sess')}catch(e){}}

/* ====================== LOGIN ====================== */
function showLogin(msg){
  $('app').classList.add('hidden');$('login').classList.remove('hidden');closeAll();
  const e=$('lgErr');if(msg){e.textContent=msg;e.classList.remove('hidden')}else e.classList.add('hidden');
}
async function doLogin(ev){
  ev.preventDefault();const b=$('lgB');b.disabled=true;b.textContent='Memeriksa...';
  try{
    const j=await api('login',{username:$('lgU').value,password:$('lgP').value});
    S.token=j.token;S.user=j.user;saveSession();$('lgP').value='';
    await boot();
  }catch(e){const x=$('lgErr');x.textContent=e.message;x.classList.remove('hidden')}
  b.disabled=false;b.textContent='Masuk';
}
async function logout(){try{await api('logout')}catch(e){}clearSession();S.data=null;showLogin()}

/* ====================== BOOT ====================== */
const PAGES={
  dashboard:{t:'Beranda',i:'home',r:()=>renderDashboard()},
  faktur:{t:'Daftar Hutang',i:'file',r:()=>renderFaktur()},
  master:{t:'Daftar Supplier',i:'book',r:()=>renderMaster()},
  supplier:{t:'Rekap Supplier',i:'users',r:()=>renderSupplier()},
  bayar:{t:'Riwayat Pembayaran',i:'card',r:()=>renderBayar()},
  aging:{t:'Umur Hutang (Aging)',i:'clock',r:()=>renderAging()},
  set:{t:'Pengaturan',i:'sliders',r:()=>renderSet()}
};
async function boot(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('uNm').textContent=S.user.nama;$('uRl').textContent=S.user.role;$('avt').textContent=(S.user.nama||'A')[0].toUpperCase();
  $('nav').innerHTML=Object.keys(PAGES).map(k=>`<a data-p="${k}" onclick="go('${k}')">${ic(PAGES[k].i)}<span>${PAGES[k].t}</span></a>`).join('');
  await reload(true);
}
async function reload(silent){
  busy(true);
  try{
    const j=await api('data');S.data=j.data;
    S.map={};S.data.faktur.forEach(f=>S.map[f.no]=f);
    $('coName').textContent=S.data.settings.nama_perusahaan||'-';
    route();
    if(!silent)toast('Data berhasil dimuat ulang');
  }catch(e){if(S.token)toast(e.message,'err')}
  busy(false);
}
function go(p){location.hash='#/'+p;closeSide()}
function route(){
  if(!S.data)return;
  let p=(location.hash.replace('#/','')||'dashboard');if(!PAGES[p])p='dashboard';
  S.page=p;killCharts();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  $('view').innerHTML=`<div class="crumb">Beranda${p!=='dashboard'?' / <b>'+PAGES[p].t+'</b>':''}</div>`+'<div id="pg"></div>';
  PAGES[p].r();hydrateIcons($('view'));window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function killCharts(){S.charts.forEach(c=>c.destroy());S.charts=[]}
function toggleSide(){$('side').classList.toggle('on');$('scrim').classList.toggle('on',$('side').classList.contains('on'))}
function closeSide(){$('side').classList.remove('on');if(!$('drawer').classList.contains('on')&&!$('modal').classList.contains('on'))$('scrim').classList.remove('on')}
function closeAll(){$('side').classList.remove('on');$('drawer').classList.remove('on');$('modal').classList.remove('on');$('scrim').classList.remove('on')}

/* ====================== HELPERS DATA ====================== */
function bucket(f){if(f.sisa<1)return -1;if(f.umur<=0)return 0;if(f.umur<=30)return 1;if(f.umur<=60)return 2;if(f.umur<=90)return 3;return 4}
function badge(f){
  let c='b-blue',t='Belum Dibayar';
  if(f.status==='Lunas'){c='b-ok';t='Lunas'}else if(f.status==='Sebagian'){c='b-warn';t='Sebagian'}
  let h=`<span class="badge ${c}">${t}</span>`;
  if(f.sisa>=1&&f.umur>0)h+=` <span class="badge b-red">Lewat ${f.umur} hr</span>`;
  return h;
}
function periodes(){return [...new Set(S.data.faktur.map(f=>f.tgl.slice(0,7)).filter(Boolean))].sort().reverse()}
function perLabel(p){const a=p.split('-');return MONF[a[1]-1]+' '+a[0]}
function suppliers(){return [...new Set(S.data.faktur.map(f=>f.supplier))].sort((a,b)=>a.localeCompare(b))}
function kpi(c,i,l,v,s){return `<div class="kpi"><div class="ki ${c}">${ic(i)}</div><div><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s||''}</div></div></div>`}
function csv(rows,name){
  const t=rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();
}
function metaBanner(){
  const m=S.data.meta;if(!m.duplikat&&!m.tidakValid)return '';
  return `<div class="banner">${ic('alert')}<div>Data spreadsheet: ${m.duplikat?m.duplikat+' baris duplikat (Nomor E-Faktur sama) diabaikan. ':''}${m.tidakValid?m.tidakValid+' baris tanpa Nomor E-Faktur diabaikan.':''}</div></div>`;
}

/* ====================== DASHBOARD ====================== */
function dseg(b,v){
  const g=b.parentNode.nextElementSibling;g.dataset.v=v;
  [...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));
  setTimeout(()=>S.charts.forEach(c=>c.resize()),30);
}
function renderDashboard(){
  const fk=S.data.faktur,open=fk.filter(f=>f.sisa>=1),od=open.filter(f=>f.umur>0);
  const tot=sum(fk,'total'),paid=sum(fk,'dibayar'),sisa=sum(fk,'sisa');
  const pct=tot?Math.round(paid/tot*100):0;
  const dueSoon=open.filter(f=>f.umur<=0&&f.umur>=-7);
  $('pg').classList.add('dash');
  $('pg').innerHTML=`
  <div class="ph"><div><h1>Dashboard Hutang</h1><div class="sub">Per ${fd(S.data.meta.today)} · diperbarui ${esc(S.data.meta.diperbarui)}</div></div>
   <div class="acts noprint">${can.pay()?`<button class="btn acc" onclick="openPay()">${ic('plus')} Catat Pembayaran</button>`:''}</div></div>
  ${metaBanner()}
  <div class="kpis">
   ${kpi('c-blue','file','Total Tagihan',rp0(tot),fk.length+' faktur')}
   ${kpi('c-green','check','Telah Dibayar',rp0(paid),pct+'% dari total tagihan')}
   ${kpi('c-amber','money','Sisa Hutang',rp0(sisa),open.length+' faktur belum lunas')}
   ${kpi('c-red','alert','Lewat Jatuh Tempo',rp0(sum(od,'sisa')),od.length+' faktur')}
   ${kpi('c-gray','clock','Jatuh Tempo ≤ 7 Hari',rp0(sum(dueSoon,'sisa')),dueSoon.length+' faktur')}
  </div>
  <div class="blk">
   <div class="mseg"><button class="on" onclick="dseg(this,'1')">Tagihan per Bulan</button><button onclick="dseg(this,'2')">Umur Hutang</button></div>
   <div class="grid2" data-v="1">
    <div class="panel p1"><div class="hd"><h3>Tagihan per Bulan (Dibayar vs Sisa)</h3></div><div class="bd cb"><div class="cw"><canvas id="c1"></canvas></div></div></div>
    <div class="panel p2"><div class="hd"><h3>Komposisi Umur Sisa Hutang</h3></div><div class="bd cb"><div class="cw"><canvas id="c2"></canvas></div></div></div>
   </div>
  </div>
  <div class="blk">
   <div class="mseg"><button class="on" onclick="dseg(this,'1')">Top Supplier</button><button onclick="dseg(this,'2')">Prioritas Bayar</button></div>
   <div class="grid2b" data-v="1">
    <div class="panel p1"><div class="hd"><h3>10 Supplier dengan Sisa Hutang Terbesar</h3><a class="btn ghost sm" onclick="go('supplier')">Lihat semua</a></div><div class="bd fill"><div class="rank" id="top5"></div></div></div>
    <div class="panel p2"><div class="hd"><h3>Prioritas Pembayaran (Jatuh Tempo Terdekat)</h3><a class="btn ghost sm" onclick="go('faktur')">Lihat semua</a></div>

  // ---- pemeriksaan kelayakan pemasangan ----
  const ok=v=>v?'✅':'❌';
  const https=location.protocol==='https:'||location.hostname==='localhost';
  let reg=false,mf=null,icons=[];
  try{reg=!!(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration())}catch(e){}
  try{const r=await fetch('manifest.json',{cache:'no-store'});if(r.ok)mf=await r.json()}catch(e){}
  if(mf&&Array.isArray(mf.icons)){
    const base=new URL('manifest.json',location.href);
    icons=await Promise.all(mf.icons.map(x=>new Promise(res=>{
      const im=new Image(),u=new URL(x.src,base).href;
      im.onload=()=>res({src:x.src,ok:true,w:im.naturalWidth,h:im.naturalHeight});
      im.onerror=()=>res({src:x.src,ok:false});
      im.src=u+(u.indexOf('?')<0?'?t='+Date.now():'');
    })));
  }
  const iconBad=icons.length===0||icons.some(x=>!x.ok)||!icons.some(x=>x.ok&&x.w>=192)||!icons.some(x=>x.ok&&x.w>=512);
  const allOk=https&&mf&&reg&&!iconBad;
  const diag=ok(https)+' Dibuka lewat HTTPS<br>'+
    ok(!!mf)+' File manifest.json terbaca<br>'+
    (icons.length?icons.map(x=>ok(x.ok)+' Ikon '+esc(x.src)+(x.ok?' ('+x.w+'×'+x.h+')':' — TIDAK DITEMUKAN')).join('<br>'):'❌ Daftar ikon di manifest kosong')+'<br>'+
    ok(reg)+' Service worker (sw.js) terdaftar';
  const hasil=iconBad
    ?'<b>Penyebab:</b> file ikon belum ter-upload atau foldernya salah. Upload 4 file PNG (icon-192.png, icon-512.png, icon-maskable-512.png, apple-touch-icon.png) langsung di folder yang sama dengan index.html, tanpa subfolder. Chrome menolak memasang aplikasi tanpa ikon.'
    :(allOk
      ?'<b>Semua file sudah benar</b>, tetapi Chrome di HP ini belum mau memasang. Coba berurutan: (1) Chrome ⋮ → Info → <b>Setelan situs</b> → <b>Hapus data &amp; reset izin</b>, tutup tab, buka lagi dan gunakan aplikasi beberapa saat; (2) pastikan <b>Google Play Services</b> aktif dan Chrome versi terbaru (pemasangan di Android memerlukannya); (3) jika menu hanya menampilkan <b>Tambahkan ke Layar utama</b>, pilih itu sebagai gantinya.'
      :'Perbaiki tanda ❌ di atas, lalu muat ulang halaman dan coba lagi.');
  $('modal').innerHTML=`
  <div class="mh"><h3>Pemasangan Belum Tersedia</h3><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <div class="mb">
   ${inapp?'<div class="banner">'+ic('alert')+'<div>Anda membuka lewat browser di dalam aplikasi lain (WhatsApp/Instagram/dll). Buka tautan ini di Chrome atau Safari.</div></div>':''}
   <div class="infobox" style="margin-top:0"><b>Pemeriksaan</b><br>${diag}</div>
   <div class="note" style="margin-top:12px">${hasil}</div>
   <div class="note" style="margin-top:12px">${steps}</div>
  </div>
  <div class="mf"><button class="btn" onclick="closeModal()">Tutup</button></div>`;
  $('modal').classList.add('on');$('scrim').classList.add('on');
}

let _dt;function debq(v){clearTimeout(_dt);_dt=setTimeout(()=>{S.f.q=v;S.f.page=1;drawFaktur()},200)}
function setF(k,v){S.f[k]=v;S.f.page=1;drawFaktur()}
function resetF(){Object.assign(S.f,{q:'',status:'',periode:'',supplier:'',page:1});renderFaktur()}
function sortBy(k){if(S.f.sort===k)S.f.dir=S.f.dir==='asc'?'desc':'asc';else{S.f.sort=k;S.f.dir=['supplier','no','nota','masa'].includes(k)?'asc':'desc'}drawFaktur()}
function filtered(){
  const F=S.f,q=F.q.toLowerCase();
  const a=S.data.faktur.filter(f=>{
    if(F.status){if(F.status==='Jatuh Tempo'){if(!(f.sisa>=1&&f.umur>0))return false}else if(f.status!==F.status)return false}
    if(F.periode&&f.tgl.slice(0,7)!==F.periode)return false;
    if(F.supplier&&f.supplier!==F.supplier)return false;
    if(q&&!(f.no+' '+f.supplier+' '+f.nota+' '+f.npwp).toLowerCase().includes(q))return false;
    return true;
  });
  const k=F.sort,d=F.dir==='asc'?1:-1;
  a.sort((x,y)=>{const A=x[k],B=y[k];return (typeof A==='number'?A-B:String(A).localeCompare(String(B)))*d});
  return a;
}
function exportFaktur(){
  const a=filtered();
  csv([['NPWP Supplier','Nama Supplier','Nomor E-Faktur','Tanggal','Masa Pajak','Tahun','Nota','Harga Jual','PPN','Total','Dibayar','Sisa','Jatuh Tempo','Status']].concat(
   a.map(f=>[f.npwp,f.supplier,f.no,f.tgl,f.masa,f.tahun,f.nota,f.dpp,f.ppn,f.total,f.dibayar,f.sisa,f.jt,f.status])),'daftar-hutang.csv');
}
function drawFaktur(){
  const F=S.f,a=filtered(),n=a.length,pages=Math.max(1,Math.ceil(n/F.size));
  if(F.page>pages)F.page=pages;
  const st=(F.page-1)*F.size,rows=a.slice(st,st+F.size);
  const th=(k,l,r)=>`<th class="s ${r?'r':''} ${F.sort===k?'on':''}" onclick="sortBy('${k}')">${l}<span class="ar">${F.sort===k?(F.dir==='asc'?'▲':'▼'):'▲▼'}</span></th>`;
  const totalRow = rows.length ? `<tr style="background:#f8fafc;font-weight:bold;border-top:2px solid #cbd5e1"><td colspan="5">Total (${n} faktur)</td><td class="r mono">${num(sum(a,'dpp'))}</td><td class="r mono">${num(sum(a,'ppn'))}</td><td class="r mono">${num(sum(a,'total'))}</td><td class="r mono">${num(sum(a,'dibayar'))}</td><td class="r mono">${num(sum(a,'sisa'))}</td><td colspan="2"></td></tr>` : '';

  $('fk').innerHTML=`
  <div class="tw"><table><thead><tr>${th('tgl','Tanggal')}${th('no','Nomor E-Faktur')}${th('supplier','Supplier')}${th('nota','Nota')}${th('masa','Masa Pajak')}${th('dpp','Harga Jual',1)}${th('ppn','PPN',1)}${th('total','Total',1)}${th('dibayar','Dibayar',1)}${th('sisa','Sisa',1)}${th('jt','Jatuh Tempo')}<th>Status</th></tr></thead>
  <tbody>${rows.length?rows.map(f=>`<tr class="clk" onclick="openDetail('${esc(f.no)}')"><td>${fd(f.tgl)}</td><td class="mono">${esc(f.no)}${f.manual?' <span class="badge b-gray">Manual</span>':''}</td><td>${esc(f.supplier)}</td><td>${esc(f.nota)||'<span class="sub">-</span>'}</td><td>${esc(f.masa)}${esc(f.tahun)}</td><td class="r mono">${num(f.dpp)}</td><td class="r mono">${num(f.ppn)}</td><td class="r mono"><b>${num(f.total)}</b></td><td class="r mono">${num(f.dibayar)}</td><td class="r mono"><b>${num(f.sisa)}</b></td><td>${fd(f.jt)}</td><td>${badge(f)}</td></tr>`).join('')+totalRow:`<tr><td colspan="12" class="empty">Tidak ada data yang cocok dengan filter.</td></tr>`}</tbody></table></div>
  <div class="mcards">${rows.length?rows.map(f=>`<div class="mc" onclick="openDetail('${esc(f.no)}')"><div class="mc1"><b>${esc(f.supplier)}</b><span>${num(f.sisa)}</span></div><div class="mc2">${esc(f.nota)||'tanpa nota'} · ${fd(f.tgl)} · JT ${fd(f.jt)}</div><div class="mc3"><span>${badge(f)}</span><span class="sub">Total ${num(f.total)}</span></div></div>`).join(''):'<div class="empty">Tidak ada data yang cocok dengan filter.</div>'}<div class="mtot">Total sisa (${n} faktur): <b>${rp(sum(a,'sisa'))}</b></div></div>
  <div class="pg"><div>Menampilkan ${n?st+1:0}–${Math.min(st+F.size,n)} dari ${n} data</div>
   <div class="pb"><select class="inp" style="width:auto;padding:6px 8px" onchange="S.f.size=+this.value;S.f.page=1;drawFaktur()">${[10,25,50,100].map(x=>`<option ${F.size===x?'selected':''}>${x}</option>`).join('')}</select>
   <button class="btn sec sm" ${F.page<=1?'disabled':''} onclick="S.f.page--;drawFaktur()">‹ Sebelumnya</button><span>Hal ${F.page}/${pages}</span><button class="btn sec sm" ${F.page>=pages?'disabled':''} onclick="S.f.page++;drawFaktur()">Berikutnya ›</button></div></div>`;
}

function getMoney(){return parseInt(($('pJml').value||'').replace(/\D/g,''),10)||0}

async function submitPay(){
  const no=S._payNo,f=S.map[no],jml=getMoney();

/* ====================== TANGGAL dd-mm-yyyy ====================== */
function iso2dmy(i){if(!i)return '';const p=i.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
function dmy2iso(s){
  const m=String(s||'').trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(!m)return '';
  const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return '';
  return y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2);
}
function maskDate(el){let v=el.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'-'+v.slice(2);el.value=v}
function dateField(id,iso){
  return `<div style="position:relative;display:flex;gap:6px"><input class="inp" id="${id}" inputmode="numeric" placeholder="dd-mm-yyyy" maxlength="10" value="${iso2dmy(iso)}" oninput="maskDate(this)"><button type="button" class="btn sec" style="padding:8px 10px" title="Pilih tanggal" onclick="pickDate('${id}')">${ic('calendar')}</button><input type="date" id="${id}_p" tabindex="-1" style="position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none" onchange="$('${id}').value=iso2dmy(this.value)"></div>`;
}
function pickDate(id){const p=$(id+'_p');p.value=dmy2iso($(id).value)||'';try{p.showPicker()}catch(e){p.focus();p.click()}}

/* ====================== DAFTAR SUPPLIER (MASTER) ====================== */
function supMatch(s,f){return (s.npwp&&f.npwp===s.npwp)||(s.nama&&f.supplier.toLowerCase()===s.nama.toLowerCase())}
function masterRows(){
  const fk=S.data.faktur;
  return S.data.suppliers.map((s,i)=>{
    const a=fk.filter(f=>supMatch(s,f));
    return Object.assign({},s,{i:i,c:a.length,open:a.filter(f=>f.sisa>=1).length,sisa:sum(a,'sisa')});
  });
}
function unsyncedCount(){
  const seen=new Set();
  S.data.faktur.forEach(f=>{if(!S.data.suppliers.some(s=>supMatch(s,f)))seen.add(f.npwp||f.supplier.toLowerCase())});
  return seen.size;
}

  $('pg').innerHTML=`
  <div class="ph"><div><h1>Riwayat Pembayaran</h1><div class="sub">Semua pembayaran yang tercatat di sheet “Pembayaran”</div></div>
   <div class="acts noprint"><button class="btn sec" onclick="exportBayar()">${ic('download')} Ekspor CSV</button>${can.pay()?`<button class="btn acc" onclick="openPay()">${ic('plus')} Catat Pembayaran</button>`:''}</div></div>
  <div class="panel"><div class="tools"><div class="sbox">${ic('search')}<input class="inp" placeholder="Cari supplier, nomor faktur, referensi..." value="${esc(S.pq)}" oninput="S.pq=this.value;drawBayar()"></div></div><div id="by"></div></div>`;
  drawBayar();
}
function bFiltered(){const q=S.pq.toLowerCase();return S.data.payments.filter(p=>!q||(p.supplier+' '+p.no+' '+p.ref+' '+p.ket+' '+p.id+' '+((S.map[p.no]||{}).nota||'')).toLowerCase().includes(q)).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id.localeCompare(a.id))}
function exportBayar(){csv([['ID','Tanggal','Nomor E-Faktur','Supplier','Jumlah','Metode','Referensi','Keterangan','Dibuat Oleh']].concat(bFiltered().map(p=>[p.id,p.tgl,p.no,p.supplier,p.jumlah,p.metode,p.ref,p.ket,p.oleh])),'riwayat-pembayaran.csv')}
function drawBayar(){
  const a=bFiltered();
  $('by').innerHTML=`<div class="tw"><table><thead><tr><th>Tanggal</th><th>ID</th><th>Nota</th><th>Nomor E-Faktur</th><th>Supplier</th><th>Metode</th><th>Referensi</th><th>Keterangan</th><th class="r">Jumlah</th><th>Oleh</th>${can.admin()?'<th></th>':''}</tr></thead>
  <tbody>${a.length?a.map(p=>`<tr><td>${fd(p.tgl)}</td><td class="sub">${esc(p.id)}</td><td><b>${esc((S.map[p.no]||{}).nota)||'-'}</b></td><td class="mono"><a style="color:var(--brand);cursor:pointer" onclick="openDetail('${esc(p.no)}')">${esc(p.no)}</a></td><td>${esc(p.supplier)}</td><td>${esc(p.metode)}${p.metode==='Selisih'?' <span class="badge b-gray">Penyesuaian</span>':''}</td><td>${esc(p.ref)\vert{}\vert{}'-'}</td><td>${esc(p.ket)||'-'}</td><td class="r mono"><b>${num(p.jumlah)}</b></td><td>${esc(p.oleh)}</td>${can.admin()?`<td><button class="btn danger sm" onclick="delPay('${esc(p.id)}')">${ic('trash')}</button></td>`:''}</tr>`).join(''):`<tr><td colspan="11" class="empty">Belum ada pembayaran tercatat.</td></tr>`}</tbody>
  <tfoot><tr><td colspan="8">Total (${a.length} transaksi)</td><td class="r mono">${num(sum(a,'jumlah'))}</td><td colspan="${can.admin()?2:1}"></td></tr></tfoot></table></div>`;
}
async function delPay(id){
  if(!confirm('Hapus pembayaran ini? Sisa hutang faktur akan bertambah kembali. Jika pembayaran ini punya baris selisih, baris itu ikut dihapus.'))return;
  busy(true);
  try{await api('deletePayment',{id:id});toast('Pembayaran dihapus');await reload(true)}catch(e){toast(e.message,'err')}
  busy(false);
}

/* ====================== AGING ====================== */
function renderAging(){
  const open=S.data.faktur.filter(f=>f.sisa>=1);
  const m={};open.forEach(f=>{const r=m[f.supplier]=m[f.supplier]||{n:f.supplier,b:[0,0,0,0,0],t:0};r.b[bucket(f)]+=f.sisa;r.t+=f.sisa});
  const rows=Object.values(m).sort((a,b)=>b.t-a.t);
  const tb=[0,1,2,3,4].map(i=>rows.reduce((s,r)=>s+r.b[i],0)),tt=tb.reduce((a,b)=>a+b,0);
  $('pg').innerHTML=`
  <div class="ph"><div><h1>Umur Hutang (Aging)</h1><div class="sub">Sisa hutang dikelompokkan berdasarkan keterlambatan dari jatuh tempo (sesuai termin tiap supplier)</div></div>
   <div class="acts noprint"><button class="btn sec" onclick="exportAging()">${ic('download')} Ekspor CSV</button><button class="btn sec" onclick="downloadPDF()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Unduh PDF</button><button class="btn sec" onclick="window.print()">${ic('printer')} Cetak</button></div></div>
  <div class="kpis">${BK.map((l,i)=>kpi(['c-green','c-amber','c-amber','c-red','c-red'][i],'clock',l,rp0(tb[i]),(tt?Math.round(tb[i]/tt*100):0)+'% dari sisa hutang')).join('')}</div>
  <div class="panel"><div class="hd"><h3>Matriks Aging per Supplier</h3></div>
  <div class="tw"><table><thead><tr><th>Supplier</th>${BK.map(b=>`<th class="r">${b}</th>`).join('')}<th class="r">Total Sisa</th></tr></thead>
  <tbody>${rows.length?rows.map(r=>`<tr class="clk" onclick="toSupplier(this.dataset.n)" data-n="${esc(r.n)}"><td><b>${esc(r.n)}</b></td>${r.b.map((v,i)=>`<td class="r mono" style="${i>=3&&v?'color:var(--bad);font-weight:600':''}">${v?num(v):'<span class="sub">-</span>'}</td>`).join('')}<td class="r mono"><b>${num(r.t)}</b></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Tidak ada hutang tersisa.</td></tr>'}</tbody>
  <tfoot><tr><td>Total</td>${tb.map(v=>`<td class="r mono">${num(v)}</td>`).join('')}<td class="r mono">${num(tt)}</td></tr></tfoot></table></div></div>`;
  S._ag={rows:rows,tb:tb,tt:tt};
}
function exportAging(){const g=S._ag;csv([['Supplier'].concat(BK,['Total Sisa'])].concat(g.rows.map(r=>[r.n].concat(r.b,[r.t]))).concat([['TOTAL'].concat(g.tb,[g.tt])],'aging-hutang.csv')}

/* ====================== PENGATURAN ====================== */
function renderSet(){
  const st=S.data.settings;
  $('pg').innerHTML=`
  <div class="ph"><div><h1>Pengaturan</h1><div class="sub">Profil, keamanan, dan parameter aplikasi</div></div></div>
  <div class="grid2b">
   <div class="panel"><div class="hd"><h3>Parameter Aplikasi</h3></div><div class="bd">
    <div class="fg"><label>Nama Perusahaan</label><input class="inp" id="sNm" value="${esc(st.nama_perusahaan)}" ${can.admin()?'':'disabled'}></div>
    <div class="fg"><label>Termin Pembayaran Default (hari)</label><input class="inp" id="sTr" type="number" min="0" max="365" value="${st.termin_default}" ${can.admin()?'':'disabled'}>
     <div class="hint">Jatuh tempo = Tanggal Faktur + termin. Data e-Faktur tidak memuat jatuh tempo, jadi dipakai termin ini. Supplier yang punya termin sendiri di menu Daftar Supplier memakai termin tersebut.</div></div>
    ${can.admin()?`<button class="btn" onclick="saveSet()">${ic('check')} Simpan Pengaturan</button>`:'<div class="sub">Hanya admin yang dapat mengubah parameter.</div>'}
   </div></div>
   <div class="panel"><div class="hd"><h3>Ubah Password</h3></div><div class="bd">
    <div class="sub" style="margin-bottom:12px">Login sebagai <b>${esc(S.user.username)}</b> (${esc(S.user.role)})</div>
    <div class="fg"><label>Password Lama</label><input class="inp" id="pwO" type="password" autocomplete="current-password"></div>
    <div class="fg"><label>Password Baru (min. 6 karakter)</label><input class="inp" id="pwN" type="password" autocomplete="new-password"></div>
    <button class="btn" onclick="savePw()">Ubah Password</button>
   </div></div>
  </div>
  <div class="panel"><div class="hd"><h3>Pasang Aplikasi</h3></div><div class="bd">
   <div class="sub" id="instStat" style="margin-bottom:12px"></div>
   <button class="btn acc" id="instSet" onclick="installApp()">${ic('download')} Pasang Aplikasi</button>
   <div class="hint">Bisa dipasang di Android, iPhone, dan laptop agar dibuka seperti aplikasi biasa dari layar utama.</div>
  </div></div>
  <div class="panel"><div class="hd"><h3>Cara Memperbarui Data</h3></div><div class="bd"><div class="note">
   Data hutang dibaca langsung dari Google Spreadsheet:
   <ol>
    <li>Buka sheet <b>Faktur</b> di spreadsheet, lalu tempel baris baru di bawah data terakhir (kolom A–I, urutan sama seperti Excel e-Faktur). Gunakan <b>Paste Special → Values only</b> (Ctrl+Shift+V).</li>
    <li>Kembali ke aplikasi ini, lalu klik tombol <b>muat ulang</b> (ikon ⟳) di pojok kanan atas.</li>
    <li>Pembayaran dicatat lewat aplikasi (tombol <b>Catat Pembayaran</b>) dan tersimpan di sheet <b>Pembayaran</b>.</li>
    <li>Bila pembayaran kurang sedikit dari sisa hutang (selisih pembulatan/potongan), centang <b>Lunasi faktur ini</b> di form pembayaran. Selisih (maks. ${rp(maxSelisih())}) dicatat sebagai baris terpisah dengan metode “Selisih”.</li>
    <li>Nomor E-Faktur dipakai sebagai kunci. Baris dengan nomor yang sama hanya dihitung sekali.</li>
   </ol></div></div></div>
  <div style="text-align:center;color:var(--mut);font-size:12.5px;padding:4px 0 10px"><div style="font-weight:600">Created By Furqon S</div><div>Versi ${APP_VERSION}</div></div>`;
  updateInstUI();
}
async function saveSet(){
  busy(true);
  try{await api('saveSettings',{nama_perusahaan:$('sNm').value,termin_default:$('sTr').value});toast('Pengaturan disimpan');await reload(true)}catch(e){toast(e.message,'err')}
  busy(false);
}
async function savePw(){
  busy(true);
  try{await api('changePassword',{oldPassword:$('pwO').value,newPassword:$('pwN').value});toast('Password berhasil diubah');$('pwO').value='';$('pwN').value=''}catch(e){toast(e.message,'err')}
  busy(false);
}

/* ====================== INIT ====================== */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
(async function init(){
  $('yr').textContent=new Date().getFullYear();
  hydrateIcons();
  let s=null;try{s=JSON.parse(localStorage.getItem('hp_sess')||'null')}catch(e){}
  if(s&&s.t&&s.u){S.token=s.t;S.user=s.u;await boot()}else showLogin();
})();
</script>
